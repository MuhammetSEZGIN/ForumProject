name: forum-project

services:
  app:
    build:
      context: .
      target: app
    environment:
      APP_NAME: ForumProject
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:8090}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Istanbul}
      APP_LOCALE: ${APP_LOCALE:-en}
      APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-en}
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: forum
      DB_USERNAME: forum
      DB_PASSWORD: ${DB_PASSWORD:-forum-local-password}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: log
    volumes:
      - app-storage:/var/www/html/storage
      - app-files:/var/www/html/FTP
      - app-key:/var/www/html/.docker-secrets
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    ports:
      - "${APP_PORT:-8090}:80"
    volumes:
      - app-storage:/var/www/html/storage:ro
      - app-files:/var/www/html/FTP:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: forum
      MYSQL_USER: forum
      MYSQL_PASSWORD: ${DB_PASSWORD:-forum-local-password}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  app-storage:
  app-files:
  app-key:
  db-data:
